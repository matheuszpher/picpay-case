name: CI (Parte 2)

on:
  push:
    branches: [main]
    paths: ["part2-ner-serving/**", ".github/workflows/ci-part2.yml"]
  pull_request:
    paths: ["part2-ner-serving/**", ".github/workflows/ci-part2.yml"]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project + lint/test tools
        run: |
          pip install ruff black
          pip install -e "./part2-ner-serving[dev]"

      - name: Lint (ruff)
        run: ruff check part2-ner-serving

      - name: Format check (black)
        run: black --check part2-ner-serving

      - name: Test (pytest)
        run: cd part2-ner-serving && pytest
