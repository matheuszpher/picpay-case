name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [part1-pokeapi-analytics, part2-ner-serving]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint/test tools
        run: pip install ruff black pytest

      - name: Lint (ruff)
        run: ruff check ${{ matrix.project }}

      - name: Format check (black)
        run: black --check ${{ matrix.project }}

      - name: Test (pytest)
        run: |
          cd ${{ matrix.project }}
          pytest || [ $? -eq 5 ]  # exit 5 = nenhum teste coletado ainda (esqueleto, Fase 0)
