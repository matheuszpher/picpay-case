name: CI (Parte 1)

on:
  push:
    branches: [main]
    paths: ["part1-pokeapi-analytics/**", ".github/workflows/ci-part1.yml"]
  pull_request:
    paths: ["part1-pokeapi-analytics/**", ".github/workflows/ci-part1.yml"]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java (PySpark)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install project + lint/test tools
        run: |
          pip install ruff black
          pip install -e "./part1-pokeapi-analytics[dev]"

      - name: Lint (ruff)
        run: ruff check part1-pokeapi-analytics

      - name: Format check (black)
        run: black --check part1-pokeapi-analytics

      - name: Test (pytest)
        run: cd part1-pokeapi-analytics && pytest
