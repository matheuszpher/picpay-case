[project]
name = "part1-pokeapi-analytics"
version = "0.1.0"
description = "Pipeline batch (PokeAPI + PySpark) em camadas medallion — PicPay ML Case, Parte 1"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyspark==3.5.3",
    "matplotlib>=3.8",
    "ipykernel>=6.29",
    "papermill>=2.5",
    # "pydantic",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    # "ruff",
    # "black",
    # "mypy",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
