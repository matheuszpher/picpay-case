# Sobe os 4 serviços da Parte 2: api (REST) + redis + prometheus + grafana.
# "docker compose up --build" deixa tudo de pé, com o dashboard e o scrape já
# provisionados (fase 2.6), e a api usando Redis de verdade como cache (fase 2.8,
# ver docs/IMPLEMENTATION.md e ADR-0004).
services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      # "redis" (não "localhost"): nome do serviço, resolvido pela rede interna do
      # compose. CACHE_BACKEND=memory continua sendo o default do código
      # (config.py) para quem roda a API fora deste compose; aqui a demo completa
      # liga Redis de propósito, para provar que a troca funciona de ponta a
      # ponta, não só em teste.
      - CACHE_BACKEND=redis
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    # allkeys-lru: a política de evicção fica no próprio Redis, não em código
    # Python (ver RedisCache em src/nercore/cache.py). 64mb é generoso para o
    # volume de uma demo local; ajustar se o cache real precisar de mais.
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]

  prometheus:
    image: prom/prometheus:v2.54.1
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
