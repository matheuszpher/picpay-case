[project]
name = "part2-ner-serving"
version = "0.1.0"
description = "Serviço de NER (spaCy) com provider abstrato, REST + MCP: PicPay ML Case, Parte 2"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "spacy>=3.7.2,<3.8",
    "click>=8.1,<9",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.7.1/en_core_web_sm-3.7.1-py3-none-any.whl",
    "fastapi>=0.110,<1",
    "uvicorn>=0.29,<1",
    "fastmcp>=4.0,<5",
    "prometheus-client>=0.20,<1",
    "redis>=5.0,<6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    # "ruff",
    # "black",
    # "mypy",
]
# Grupo separado de "dev" de propósito (ADR-0013: o playground não pode roubar
# tempo de CI). O CI só instala ".[dev]"; só o Dockerfile (imagem final) instala
# ".[dev,demo]", para o serviço opcional do compose ter o gradio disponível.
demo = [
    "gradio>=6.0,<7",
]

[tool.ruff.lint.per-file-ignores]
# Timestamp fixo de propósito nos testes: comparação determinística, sem fuso
# horário relevante (mesmo padrão da Parte 1).
"tests/test_schemas.py" = ["DTZ001"]

[tool.ruff.lint.flake8-bugbear]
# `Depends(...)` em default de parâmetro é o padrão idiomático do FastAPI (não uma
# mutable default real: Starlette resolve isso via introspecção da assinatura, nunca
# reavalia o valor por request). Sem isso, B008 dispara em toda rota do projeto.
extend-immutable-calls = ["fastapi.Depends"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
